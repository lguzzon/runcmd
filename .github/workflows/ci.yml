name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install scripts dependencies
        run: cd scripts && bun install --frozen-lockfile

      - name: Type-check (strict + checkJs)
        run: cd scripts && bunx tsc --project tsconfig.json --noEmit

      - name: Lint and format check
        run: |
          bunx oxlint@1.88.0 .
          # Format gate covers shipped code only. CHANGELOG.md is generated by
          # scripts/lib/changelog.js and the agent/doc markdown is hand-maintained,
          # so neither is held to the formatter.
          bunx oxfmt@0.73.0 --check scripts/ website/src runcmd-update.js runcmd-update.manifest.js

      - name: Shellcheck runner
        run: |
          # Ubuntu runners ship shellcheck; a bare container (act, a slim image)
          # does not. Install it when missing so the step does not depend on the
          # runner image. Verified clean under both 0.9.0 (GitHub's) and 0.11.0.
          if ! command -v shellcheck >/dev/null 2>&1; then
            SUDO=""
            command -v sudo >/dev/null 2>&1 && SUDO=sudo
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq shellcheck
          fi
          shellcheck -S warning runcmd.sh

      - name: Install git-flow
        run: |
          # The realrepo suites drive actual `git flow`; ubuntu-latest ships
          # none, so the suite's last test failed and killed the runner.
          # Reuse the project's own pinned installer (URL, sha256 and version
          # live in scripts/lib/installer.js) rather than repeating them here.
          bun -e "const m = await import('./scripts/lib/installer.js'); if (!m.ensureGitFlowAvailable({ autoInstall: true })) process.exit(1)"
          # GITHUB_PATH only reaches later steps, so prepend for the check here.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          git flow version

      - name: Run tests
        run: bun test --isolate

      - name: End-to-end test
        run: bash tests/e2e/runcmd.e2e.sh

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: cd website && bun install --frozen-lockfile

      - name: Astro check
        run: cd website && bun run check

      - name: Build website
        run: cd website && bun run build
