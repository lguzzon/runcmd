name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  test-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Install scripts dependencies
        run: cd scripts && bun install --frozen-lockfile

      - name: Type-check (strict + checkJs)
        run: cd scripts && bunx tsc --project tsconfig.json --noEmit

      - name: Run tests
        run: bun test scripts/ --isolate