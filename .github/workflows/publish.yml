name: Publish to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.2'

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Cache Bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-${{ hashFiles('website/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-${{ env.BUN_VERSION }}-

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: cd website && bun install --frozen-lockfile

      - name: Build Website
        run: cd website && bun run build

      - name: Copy Scripts to Public
        run: |
          cp runcmd.sh runcmd.bat runcmd-update.js runcmd-update.manifest.js version.txt public/
          # Update manifest: sha256sum-style lines consumed by runcmd.sh and
          # runcmd-update.js to verify downloaded updates before overwrite.
          # Generated here so hashes match the exact bytes served.
          sha256sum runcmd.sh runcmd.bat runcmd-update.js runcmd-update.manifest.js > public/update.sha256
          ls -R public

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
